sales_dwh:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'SALES_DWH_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'SALES_DATA_WAREHOUSE') }}"
      schema: SILVER          # default; dbt_project.yml overrides per model group
      threads: 4
      client_session_keep_alive: false
      query_tag: airflow_dbt_run
